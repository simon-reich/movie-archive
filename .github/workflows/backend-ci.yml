name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  ci:
    name: Lint · Test · Coverage · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: backend
        run: chmod +x gradlew

      # ── Step 1: Lint / Typecheck ─────────────────────────────────────────
      - name: Compile (lint)
        working-directory: backend
        run: ./gradlew compileJava compileTestJava --no-daemon

      # ── Step 2: Tests ────────────────────────────────────────────────────
      # Testcontainers spins up real PostgreSQL via Docker (available on ubuntu-latest).
      # GreenMail runs in-process; no extra service needed.
      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      # ── Step 3: Coverage gate ────────────────────────────────────────────
      - name: Generate JaCoCo report
        working-directory: backend
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Enforce coverage thresholds
        working-directory: backend
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/

      # ── Step 4: Build JAR ────────────────────────────────────────────────
      - name: Build Spring Boot JAR
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          retention-days: 7
