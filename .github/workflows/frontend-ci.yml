name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  ci:
    name: Lint · Typecheck · Test · Coverage · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # ── Step 1: Lint ─────────────────────────────────────────────────────
      - name: Lint (ESLint)
        working-directory: frontend
        run: pnpm lint

      # ── Step 2: Typecheck ────────────────────────────────────────────────
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      # ── Step 3: Unit + component tests ───────────────────────────────────
      - name: Run unit tests
        working-directory: frontend
        run: pnpm test

      # ── Step 4: Coverage gate ─────────────────────────────────────────────
      # Thresholds are enforced inside vitest.config.ts — this step fails the
      # job if any threshold is violated.
      - name: Run tests with coverage gate
        working-directory: frontend
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: frontend/coverage/
          retention-days: 7

      # ── Step 5: Build ────────────────────────────────────────────────────
      - name: Build Nuxt bundle
        working-directory: frontend
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-output
          path: frontend/.output/
          retention-days: 7
