spring.application.name=movie-archive

# Server
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moviearchive}
spring.datasource.username=${DB_USER:moviearchive}
spring.datasource.password=${DB_PASSWORD:moviearchive}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenSearch
opensearch.host=${OPENSEARCH_HOST:localhost}
opensearch.port=${OPENSEARCH_PORT:9200}

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.from=${MAIL_FROM:noreply@moviearchive.local}

# JWT
jwt.secret=${JWT_SECRET:change-me-in-production-min-32-chars!!}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Encryption
encryption.master-key=${ENCRYPTION_MASTER_KEY:change-me-in-production-32chars!}

# App
app.base-url=${APP_BASE_URL:http://localhost:3000}
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# External API base URLs (overridden by WireMock in tests via @DynamicPropertySource)
tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org}
omdb.base-url=${OMDB_BASE_URL:https://www.omdbapi.com}
wikipedia.base-url=${WIKIPEDIA_BASE_URL:https://en.wikipedia.org}
wikidata.sparql-base-url=${WIKIDATA_SPARQL_BASE_URL:https://query.wikidata.org}
# Pacing for the batched SPARQL Wikidata resolution calls (resolveChunkViaWikidataSparql) —
# kept independent from wikipedia.request-pacing-ms below and deliberately conservative given
# this project's history of two prior live rate-limit incidents against Wikidata/Wikipedia
# endpoints (12-RESEARCH.md Pitfall 1).
wikidata.request-pacing-ms=${WIKIDATA_REQUEST_PACING_MS:3000}
# Minimum delay before every individual outbound Wikipedia API call (not just between
# movies — see WikipediaClient.paceRequest javadoc). Empirically, Wikipedia's anonymous
# API rate limiter tolerates ~1 req/s sustained but blocks (429) within seconds under
# faster bursts.
wikipedia.request-pacing-ms=${WIKIPEDIA_REQUEST_PACING_MS:1000}

# Wiki batch-reload (Phase 8: cooldown window + inter-request pacing, D-04/D-08)
# TEMPORARY (dev-testing) — was 30, set to 0 so batch-reload can immediately re-process previously-failed movies against the new Wikidata-first lookup; revert to 30 when done testing
wiki.retry.cooldown-days=${WIKI_RETRY_COOLDOWN_DAYS:0}
wiki.retry.pacing-delay-ms=${WIKI_RETRY_PACING_DELAY_MS:1000}

# Bulk import (Phase 10: single-line-at-a-time async processing, D-11)
bulk-import.pacing-delay-ms=${BULK_IMPORT_PACING_DELAY_MS:1000}
# WR-02 fix (review): reject uploads exceeding this line count with 400 before dispatching the
# async job — the bulkImportExecutor is sized to a single global run-slot + queue-slot.
bulk-import.max-lines=${BULK_IMPORT_MAX_LINES:5000}

# Logging
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
