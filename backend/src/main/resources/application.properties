spring.application.name=movie-archive

# Server
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moviearchive}
spring.datasource.username=${DB_USER:moviearchive}
spring.datasource.password=${DB_PASSWORD:moviearchive}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenSearch
opensearch.host=${OPENSEARCH_HOST:localhost}
opensearch.port=${OPENSEARCH_PORT:9200}

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.from=${MAIL_FROM:noreply@moviearchive.local}

# JWT
jwt.secret=${JWT_SECRET:change-me-in-production-min-32-chars!!}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Encryption
encryption.master-key=${ENCRYPTION_MASTER_KEY:change-me-in-production-32chars!}

# App
app.base-url=${APP_BASE_URL:http://localhost:3000}
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# External API base URLs (overridden by WireMock in tests via @DynamicPropertySource)
tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org}
omdb.base-url=${OMDB_BASE_URL:https://www.omdbapi.com}
wikipedia.base-url=${WIKIPEDIA_BASE_URL:https://en.wikipedia.org}

# Logging
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
