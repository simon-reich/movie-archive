# Test profile — overrides application.properties
# Testcontainers manage the real DB; datasource URL is set programmatically.
# Spring Boot auto-configures Testcontainers datasource when @ServiceConnection is used.

spring.flyway.enabled=true

# Disable mail auto-config (GreenMail takes over per test)
spring.mail.host=localhost
spring.mail.port=3025

# JWT / Encryption — fixed test values
jwt.secret=test-secret-key-that-is-long-enough-32c
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000
encryption.master-key=test-encryption-key-32-characters!

app.base-url=http://localhost

# External API base URLs — overridden by @DynamicPropertySource in SettingsIntegrationTest
tmdb.base-url=http://localhost:0
omdb.base-url=http://localhost:0

logging.level.de.moviearchive=DEBUG

# OpenSearch — placeholder values overridden at runtime by @DynamicPropertySource in AbstractOpenSearchTest
opensearch.host=localhost
opensearch.port=9200

# Wiki batch-reload pacing — fast global default for the whole suite (RESEARCH.md Pitfall 5).
# Individual tests that need to observe real pacing timing override this per-class via
# @DynamicPropertySource.
wiki.retry.pacing-delay-ms=1

# Bulk import pacing — fast global default for the whole suite, same rationale as
# wiki.retry.pacing-delay-ms above.
bulk-import.pacing-delay-ms=1

# Per-request Wikipedia API pacing (WikipediaClient) — fast default for the suite, same
# rationale as wiki.retry.pacing-delay-ms above. Real value (1000ms) only matters against
# the live Wikipedia API; tests hit WireMock and don't need to wait for it.
wikipedia.request-pacing-ms=0

# Per-request Wikidata API pacing (WikipediaClient.tryFetchViaWikidata) — fast default for the
# suite, same rationale as wikipedia.request-pacing-ms above. Real value (3000ms) only matters
# against the live Wikidata API; tests hit WireMock and don't need to wait for it. Keeping this
# at 0 also preserves the intent of the 429-backoff regression tests in WikipediaClientTest:
# their elapsed>=950ms floor must come from the shared backoffUntil wait alone, not from an
# unrelated fixed per-request Wikidata sleep.
wikidata.request-pacing-ms=0
