# ─────────────────────────────────────────────────────────────────
# MovieArchive — Docker Compose
#
# Profiles:
#   (none)  — infra only: postgres, opensearch, dashboards, mailpit
#             Use this during local development (BE/FE run natively).
#             docker compose up -d
#
#   app     — full stack including built BE + FE containers + Caddy
#             docker compose --profile app up -d
#
# Required .env vars: DB_PASSWORD, JWT_SECRET, ENCRYPTION_MASTER_KEY
# ─────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure (always started) ──────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moviearchive
      POSTGRES_USER: moviearchive
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviearchive"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-Admin1234!}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # Web UI  →  http://localhost:8025
      - "1025:1025"   # SMTP
    restart: unless-stopped

  # ── Application stack (profile: app) ─────────────────────────

  backend:
    profiles: [app]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/moviearchive
      DB_USER: moviearchive
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: /api
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    profiles: [app]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  opensearch_data:
  caddy_data:
  caddy_config:
